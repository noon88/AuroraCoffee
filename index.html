<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Aurora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="overlay">
    <h1>Café Aurora</h1>
    <p>Onde o tempo desacelera ☕</p>
    <button onclick="scrollToSection()">Conheça</button>
  </div>
</header>

<nav class="tabs">
<button class="tab active" onclick="switchTab(this, 'sobre')">Sobre</button>
<button class="tab" onclick="switchTab(this, 'menu')">Menu</button>
<button class="tab" onclick="switchTab(this, 'ambiente')">Ambiente</button>
</nav>

<section class="content">

  <div class="tab-content active" id="sobre">
    <h2>Nossa História</h2>
    <p>
      O Café Aurora nasceu para ser um refúgio.
      Grãos selecionados, ambiente acolhedor e silêncio bom.
    </p>
    <img src="images/cafe1.jpg" alt="Café servido">
  </div>

  <div class="tab-content" id="menu">
    <h2>Nosso Menu</h2>
    <p>Espresso, cappuccino, cafés especiais e doces artesanais.</p>
    <img src="images/cafe2.jpg" alt="Bebidas do café">
  </div>

  <div class="tab-content" id="ambiente">
    <h2>O Ambiente</h2>
    <p>Luz suave, madeira, aroma de café fresco.</p>
    <img src="images/ambiente.jpg" alt="Ambiente da cafeteria">
  </div>

</section>

<footer>
  <p>© 2026 Café Aurora</p>
</footer>

<script src="script.js"></script>
</body>
</html>
